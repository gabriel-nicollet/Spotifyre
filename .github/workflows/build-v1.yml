name: V1 Spotifyre hybrid IPA build

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to your decrypted Spotify IPA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v5
        with:
          ref: V1-Spotifyre
      - uses: levibostian/action-hide-sensitive-inputs@v1
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
      - name: Install build tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git
      - name: Download decrypted Spotify IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p ipa
          curl --fail --location --silent --show-error "$IPA_URL" -o ipa/spotify.ipa
          test -s ipa/spotify.ipa
          file ipa/spotify.ipa
          unzip -tq ipa/spotify.ipa
      - name: Build Vitrine hybrid IPA
        run: |
          test -x scripts/pipeline.sh || chmod +x scripts/pipeline.sh
          test -x scripts/extract-flags.py || chmod +x scripts/extract-flags.py
          make release IPA=ipa/spotify.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v5
        with:
          name: V1-Spotifyre-hybrid-IPA
          path: out/*.ipa
          if-no-files-found: error
          retention-days: 7
